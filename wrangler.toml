name = "baogame"
main = "src/worker.js"
compatibility_date = "2026-04-07"
compatibility_flags = ["nodejs_compat"]

# Room DO 的机房偏好：默认 auto（按第一位进入房间的玩家所在洲自动选择，
# 见 src/constants.js 的 CONTINENT_HINT）。如需固定，可改成 apac / wnam / enam /
# sam / weur / eeur / oc / afr / me，例如：
# [vars]
# ROOM_LOCATION = "apac"

# 每个房间对应一个 Durable Object 实例
[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

# 房间列表（单例）Durable Object
[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

# Durable Object 迁移/命名空间配置
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room", "Lobby"]

# 静态资源（HTML/CSS/JS/图片）通过 Workers Assets 提供
# 直接指向 static/ 子目录，避免把项目根（含 node_modules）当成 asset 目录
# 注意：game/ 与 src/ 不在此目录，仍会经 esbuild 打包进 Worker bundle 运行
[assets]
directory = "static"
binding = "ASSETS"
